Searches:
  pokemon:
    search:
      repository: Happy\Coding\Domain\Repository\PokemonRepository

    sorting:
      1000:
        label: "Identifier ▲"
        fields:
          'identifier': ASC
      1010:
        label: "Identifier ▼"
        fields:
          'identifier': DESC

      2000:
        label: "Weight ▲"
        fields:
          'weight': ASC
      2010:
        label: "Weight ▼"
        fields:
          'weight': DESC

      3000:
        label: "Height ▲"
        fields:
          'height': ASC
      3010:
        label: "Height ▼"
        fields:
          'height': DESC

    autocomplete:
      identifier:
        label: "Identifier"
        selector:
          conditions:
            once: true
          freeInput: true
          labelProperty: identifier
        matches:
          like:
            - identifier

      height:
        label: "Height"
        selector:
          conditions:
            once: true
          freeInput: true
        matches:
          like:
            - height

      weight:
        label: "Weight"
        inputType: "number"
        selector:
          conditions:
            once: true
          values:
            '50': '50'
            '100': '100'
            '150': '150'
        matches:
          like:
            - weight

      freetext:
        label: "Suche nach"
        selector:
          conditions:
            once: true
        matches:
          like:
            - identifier
            - height
            - weight
